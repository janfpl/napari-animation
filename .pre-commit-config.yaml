repos:
-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
    - id: isort
      exclude: _vendor|vendored|examples|benchmarks
-   repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
    - id: black
      pass_filenames: true
      exclude: _vendor|vendored|examples|benchmarks
-   repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
    - id: flake8
      pass_filenames: true
      # this seems to need to be here in addition to setup.cfg
      exclude: _vendor|vendored|__init__.py|examples|benchmarks
