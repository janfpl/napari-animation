name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run isort, black and flake8
        run: |
          python -m pip install --upgrade pip pre-commit
          pre-commit run --all-files --show-diff-on-failure

  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the package version from the git history
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # A display with OpenGL (Xvfb on Linux, Mesa on Windows) and the Qt
      # system libraries, so viewer and screenshot tests can run.
      - uses: pyvista/setup-headless-display-action@v3
        with:
          qt: true
          pyvista: false

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[testing]" "napari[pyqt5]"

      - name: Test
        run: python -m pytest -v --color=yes napari_animation
